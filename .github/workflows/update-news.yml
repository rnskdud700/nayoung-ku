name: 매일 IT 뉴스 업데이트

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 파일 준비
        uses: actions/checkout@v4
      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 필요한 도구 설치
        run: pip install -r requirements.txt
      - name: 최신 뉴스 수집
        run: |
          python main.py
          cp dashboard.html index.html
          touch .nojekyll
      - name: GitHub Pages 준비
        uses: actions/configure-pages@v5
      - name: 공개할 페이지 묶기
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: 공개하기
        id: deployment
        uses: actions/deploy-pages@v4
